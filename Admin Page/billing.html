<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./adminCSS/navStyle.css">
    <link rel="stylesheet" href="./adminCSS/sidebar.css">
    <link rel="stylesheet" href="./adminCSS/billing.CSS">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="shortcut icon" href="../Images/favicon.png" type="image/png">
    <title>Admin</title>
</head>
<body>
    <nav class="big-nav">
        <div>
            <img src="../Images/appLogo (2).png">
            <h2>Royalty Admin</h2>
        </div>
        
        <div>
            <ul>
                <li class="active" id="dashboard">Dashboard</li>
                <li id="profile">My Profile</li>
                <li id="about">About Us</li>
                <li id="logout"><button>Logout</button></li>
            </ul>
        </div>
    </nav>

    <nav class="small-nav">
        <div class="menu-icon hide" id="menuIcon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <a href="#" class="back-btn-svg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M15 18l-6-6 6-6" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          
          

        <div class="nav-item">
            <img src="../Images/appLogo (2).png">
            <h3>Royalty Admin</h3>
        </div>
        

        <div class="side-bar" id="sidebar">
            <div id="sidebar-header">
                <h3>Royalty Admin</h3>
            </div>

            <div class="sidebar-content">
                <div class="pages">
                    <a id="s-dashboard" href="./dashboard.html"><span class="material-symbols-outlined">
                        web_asset
                        </span> Dashboard</a>
                    <a id="s-profile" href="./profile.html"><span class="material-symbols-outlined">
                        account_circle
                        </span> Profile</a>
                    <a id="s-about" href="about.html"><span class="material-symbols-outlined">
                        page_footer
                        </span> About Us</a>
                </div>

                <button id="s-logout">
                    <span class="material-symbols-outlined">logout</span> 
                    Logout
                </button>
                
            </div>

        </div>

    </nav>

    <div class="loader">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="data hide">
        <main>
            <h1>Billing Details</h1>
            
            <div class="customer-data">
                <p id="name"><b>Customer Name:</b></p>
                <p id="phone"><b>Phone:</b> </p>
                <p id="points"><b>Points: </b></p>
                <p id="joining-date"><b>Joining Date:</b> </p>
            </div>
        
            <form class="item-input" id="billing-form">
                <label>
                    Item Purchased
                    <input type="text" name="item" id="item" placeholder="Item Name" required>
                </label>
                <label>
                    Cost
                    <input type="number" name="cost" id="cost" placeholder="Cost in ₹" required>
                </label>
                <label>
                    Number
                    <input type="number" name="item-number" id="item-number" placeholder="number = 1" required>
                </label>
                <label>
                    Item Type
                    <select name="type" id="item-type" required>
                        <option value="" disabled selected>Select Type</option>
                        <option value="cosmetic">Cosmetic</option>
                        <option value="bangles">Bangles</option>
                        <option value="ice-cream">Ice Cream</option>
                        <option value="other" selected>Other</option>
                    </select>
                </label>
                <button type="submit">Add</button>
            </form>
        
            <table class="items">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Amount (₹)</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="item-list">
                    <!-- JavaScript will insert rows here -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3" style="text-align: right;"><b>Total:</b></td>
                        <td id="total-cost">₹0</td>
                    </tr>
                </tfoot>
            </table>
        </main>
        
    </div>

    <script type="module" src="./adminJS/firebase.js"></script>
    <script type="module" src="./adminJS/billing.js"></script>
</body>
</html>
