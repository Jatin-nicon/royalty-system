<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./adminCSS/unauthorized.css">
    <link rel="stylesheet" href="./adminCSS/navStyle.css">
    <link rel="stylesheet" href="./adminCSS/sidebar.css">
    <link rel="stylesheet" href="./adminCSS/loader.css">
    <link rel="shortcut icon" href="../Images/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Admin</title>
</head>
<body>
    <nav class="big-nav hide">
        <div>
            <img src="../Images/appLogo (2).png">
            <h2>Royalty Admin</h2>
        </div>
        
        <div>
            <ul>
                <li class="active" id="dashboard">Dashboard</li>
                <li id="logout"><button>Logout</button></li>
            </ul>
        </div>
    </nav>

    <nav class="small-nav hide">
        <div class="menu-icon" id="menuIcon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div>
            <img src="../Images/appLogo (2).png">
            <h3>Royalty Admin</h3>
        </div>
        

        <div class="side-bar" id="sidebar">
            <div id="sidebar-header">
                <h3>Royalty Admin</h3>
            </div>

            <div class="sidebar-content">
                <div class="pages">
                    <a id="s-dashboard" href="./dashboard.html"><span class="material-symbols-outlined">
                        web_asset
                        </span> Dashboard</a>
                </div>

                
                <button id="s-logout">
                    <span class="material-symbols-outlined">logout</span> 
                    Logout
                </button>
                
            </div>

        </div>

    </nav>

    <div class="loader">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="data hide">
        <main>
            <div class="search">
                <label>
                    <input type="text" placeholder="Search Users">
                </label>
                <select name="search-type">
                    <option value="firstName">First Name</option>
                    <option value="phone">Phone</option>
                    <option value="email">Email</option>
                    <option value="all" selected>All</option>
                </select>
                <button type="button">Search</button>
            </div>

            <div class="data-table">
                <table id="usersTable">
                    <tbody id="usersBody">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Points</th>
                                <th>Select</th>
                            </tr>
                        </thead>
                    </tbody>
                </table>
            </div>
            
            
        </main>
        
    </div>
    
    <script type="module" src="./adminJS/firebase.js"></script>
    <script type="module" src="./adminJS/unauthorized.js"></script>
    <script src="./adminJS/sidebar.js"></script>
</body>
</html>
